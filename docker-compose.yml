# The whole deployment, described once. One-time host setup — the data
# volume is external so no compose command can ever delete the database:
#
#   docker volume create jpetstore-data
#
services:
  petstore:
    image: ${IMAGE:-registry.livepeer.tools/jpetstore-rs}:${TAG:-latest}
    restart: unless-stopped
    # No published port: since lesson 7, Caddy is the only way in.
    expose:
      - "8081"
    volumes:
      - jpetstore-data:/data
    healthcheck:
      # The binary probes itself — a scratch image has no curl to borrow.
      test: ["CMD", "/jpetstore-rs", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  litestream:
    image: litestream/litestream:0.3
    restart: unless-stopped
    command: replicate
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-file:///backup/jpetstore}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
    volumes:
      - jpetstore-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
      - jpetstore-backup:/backup

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Not external on purpose: losing this volume
      # costs a re-issue, not data — though Let's Encrypt rate limits mean
      # you shouldn't make a habit of it.
      - caddy-data:/data

volumes:
  jpetstore-data:
    external: true
    name: ${DATA_VOLUME:-jpetstore-data}
  caddy-data:
  # The local demo replica. With a cloud LITESTREAM_REPLICA_URL this volume
  # sits unused; the point of backups is that they DON'T live on this host.
  jpetstore-backup:
