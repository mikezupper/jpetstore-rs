{% extends "base.html" %}

{% block title %}Register — JPetStore{% endblock %}

{% block content %}
<h2>Register</h2>

{% if let Some(message) = error %}
<p><strong>{{ message }}</strong></p>
{% endif %}

<form method="post" action="/register">
    <p><label>Username <input name="username" required></label></p>
    <p><label>Password <input name="password" type="password" required minlength="4"></label></p>
    <p><label>Email <input name="email" type="email" required></label></p>
    <p><label>First name <input name="first_name" required></label></p>
    <p><label>Last name <input name="last_name" required></label></p>
    <p><label>Address <input name="address" required></label></p>
    <p><label>City <input name="city" required></label></p>
    <p><label>State <input name="state" required></label></p>
    <p><label>ZIP <input name="zip" required></label></p>
    <p><label>Country <input name="country" required></label></p>
    <p><label>Phone <input name="phone" required></label></p>
    <p><button>Create Account</button></p>
</form>
{% endblock %}
