<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}JPetStore{% endblock %}</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: system-ui, sans-serif;
            max-width: 42rem;
            margin: 3rem auto;
            padding: 0 1rem;
            line-height: 1.6;
        }
        header {
            border-bottom: 2px solid #2b6f4e;
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }
        header h1 { margin: 0; font-size: 1.4rem; }
        header p { margin: 0; opacity: 0.7; font-size: 0.9rem; }
        a { color: #2b8f5e; }
    </style>
</head>
<body>
<header>
    <h1><a href="/" style="text-decoration:none; color:inherit;">JPetStore</a></h1>
    <p>the pet store you already know — now in Rust</p>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
